[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-token-optimizer"
version = "1.0.0"
description = "Token & Context Optimization Suite for Google Antigravity IDE & CLI"
readme = "README.md"
authors = [{ name = "axxion" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/axxion/antigravity-token-optimizer"
Repository = "https://github.com/axxion/antigravity-token-optimizer"
Issues = "https://github.com/axxion/antigravity-token-optimizer/issues"

[project.scripts]
antigravity-optimizer = "antigravity_optimizer.cli:main"

[tool.setuptools.packages.find]
include = ["antigravity_optimizer*"]
